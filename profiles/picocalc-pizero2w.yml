---
# Profile #1 — a PicoCalc shell with a Raspberry Pi Zero 2 W (a Linux SBC) inside.
#
# A profile is DATA: the high-level facts about a device. Roles read these; the
# shell/renderer layers derive from `screen`. The PicoCalc hardware STEPS live in
# the `init` role (a faithful translation of the upstream guide), selected by the
# `hardware` field below — they are not parameterised here.

board: pi-zero-2w            # Linux SBC; confirm with /proc/device-tree/model + uname -m
arch: aarch64                # 64-bit ARM (Cortex-A53). Pending on-device confirmation.
ram_mb: 512                  # shared with the framebuffer — the binding constraint (SPEC §6)

screen:
  width: 320
  height: 320
  dpi: ~                     # unknown / not yet measured

input: picocalc-i2c-keyboard # STM32-backed keyboard over I2C

hardware: picocalc           # selects the init role's hardware-enablement flow

# Descriptive — the driver stack + known quirks.
drivers:
  - mipi-dbi-spi-panel
  - picocalc-keyboard
quirks:
  - no-hardware-cursor
  - pwm-audio
