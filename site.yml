---
# cyberdeck — turn a flashed card with SSH open into a usable homelab terminal.
#
# Increment 1 (working): base + tooling + dotfiles. Later increments are
# scaffolded under roles/ and wired in here as they land — see the commented
# roadmap below. Profile-driven; nothing hardcodes a device.
#
#   cp config.example.yml config.yml           && $EDITOR config.yml
#   cp inventory/hosts.example.ini inventory/hosts.ini && $EDITOR inventory/hosts.ini
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml

- name: Provision cyberdeck device
  hosts: cyberdeck
  become: true
  vars_files:
    - config.yml                      # copied from config.example.yml; gitignored

  # Map the human-friendly nested config onto the flat variables the roles use.
  # Keeps config.yml readable and roles simple (no deep-merge surprises).
  vars:
    device_user: "{{ device.user }}"
    timezone: "{{ device.timezone }}"
    locale: "{{ device.locale }}"
    cyberdeck_profile: "{{ device.profile }}"
    device_authorized_keys: "{{ ssh.authorized_keys | default([]) }}"
    dotfiles_public_repo: "{{ dotfiles.public_repo | default('') }}"

  pre_tasks:
    - name: Require a supported Ansible (project is pinned to core >= 2.21)
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.21', '>=')
        fail_msg: >-
          cyberdeck is pinned to ansible-core >= 2.21 (tested on 2.21 / ansible 14).
          You have {{ ansible_version.full }} — see requirements.txt.
      tags: [always]

    - name: Load the active device profile
      ansible.builtin.include_vars:
        file: "profiles/{{ cyberdeck_profile }}.yml"
        name: profile
      tags: [always]

    - name: Announce which profile/board is being provisioned
      ansible.builtin.debug:
        msg: >-
          Profile {{ cyberdeck_profile }} -> board {{ profile.board }},
          screen {{ profile.screen.width }}x{{ profile.screen.height }},
          RAM ceiling {{ profile.ram_mb }} MB
      tags: [always]

    # Print a copy-paste command to watch the deck's live output (apt install
    # churn, service logs) from another terminal while this push run proceeds.
    - name: Show how to watch this deck's live output during provisioning
      ansible.builtin.debug:
        msg:
          - "Watch this deck live from another terminal while Ansible runs:"
          - "  ssh {{ ansible_user | default(device_user) }}@{{ ansible_host | default(inventory_hostname) }} 'journalctl -f'"
          - "  apt install detail (deps/progress):"
          - "  ssh {{ ansible_user | default(device_user) }}@{{ ansible_host | default(inventory_hostname) }} 'sudo tail -F /var/log/apt/term.log'"
      tags: [always]

  # Tags: each role is tagged with its own name plus a slice —
  #   core    a secure, connected terminal (init … lock, identity, creds, dotfiles, tailscale)
  #   extras  what you install and iterate on (workstation, git, downloads, catalogue, comms)
  #   access  overlay: the revocable credentials (identity, creds, tailscale)
  # e.g. --tags extras · --tags downloads,catalogue · --skip-tags init. See docs/tags.md.
  roles:
    # init runs FIRST: it brings the PicoCalc hardware up (display, keyboard,
    # audio, poweroff) and REBOOTS so the overlays load — then the system stages
    # below run on a device with a working screen + keyboard. Runs only for
    # profiles with `hardware: picocalc`, so generic boards are unaffected.
    - { role: init,          tags: [init, core] }
    - { role: base,          tags: [base, core] }
    - { role: wifi,          tags: [wifi, core] }               # prioritised NetworkManager profiles (+ static IP) from the wifi list
    - { role: tooling,       tags: [tooling, core] }
    - { role: console_fonts, tags: [console_fonts, core] }      # console font library + `deck-font` switcher (320x320)
    - { role: lock,          tags: [lock, core] }               # console blank + idle logout + tmux vlock (G34)
    - { role: workstation,   tags: [workstation, extras] }      # uv python toolchain (several versions) + apt/pip lists
    - { role: identity,      tags: [identity, core, access] }   # copy the user-provided ssh.identity_keys (outbound auth)
    - { role: git,           tags: [git, extras] }              # clone the git list + run each entry's install commands
    - { role: downloads,     tags: [downloads, extras] }        # pinned URL + sha256 (e.g. release binaries) + install commands
    - { role: catalogue,     tags: [catalogue, extras] }        # record what's installed + the `deck-catalogue` command
    - { role: creds,         tags: [creds, core, access] }      # personal-tier env file (0600); lab tier absent by design
    - { role: dotfiles,      tags: [dotfiles, core] }
    - { role: comms,         tags: [comms, extras] }            # BBS + Usenet clients + per-server launchers (public servers)
    - { role: tailscale,     tags: [tailscale, core, access] }  # next-hop to the homelab; no-ops when auth_key is unset

  post_tasks:
    # Success banner: confirm the deck is reachable and leave the handy commands
    # (ssh + live journal) in the console. Memory headroom is acceptance (f).
    - name: Provisioning complete — connection + handy commands
      vars:
        _addr: "{{ ansible_user | default(device_user) }}@{{ ansible_host | default(inventory_hostname) }}"
      ansible.builtin.debug:
        msg:
          - "✓ cyberdeck provisioned — deck reachable over SSH:"
          - "    ssh {{ _addr }}"
          - "  watch its live output:"
          - "    ssh {{ _addr }} 'journalctl -f'"
          - "  memory: {{ ansible_facts.memfree_mb }} MB free / {{ ansible_facts.memtotal_mb }} MB total (acceptance f)"
