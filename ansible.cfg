[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
# YAML-formatted task output. The old `yaml` callback (community.general) was
# removed; the built-in default callback now does it via result_format.
stdout_callback = default
result_format = yaml
# Host-key checking stays ON (public repo, secure default). Re-flashing a card
# changes the host key — clear the stale entry before re-provisioning:
#   ssh-keygen -R <device-host>
host_key_checking = True

[privilege_escalation]
become = True
