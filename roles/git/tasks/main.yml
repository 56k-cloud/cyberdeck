---
# git — clone the `git` list onto the deck and run each entry's `install`
# commands. No build types, no guessing: `install` is exactly what runs — in
# order, in the clone dir, stopping at the first failure (like joining with &&).
# Commands run in a bash LOGIN shell as the device user, so they see the same
# PATH you do (~/.local/bin, uv, the default python env).
#
# Idempotent: install re-runs only when the checked-out commit or the commands
# change (a marker per entry records what was last installed successfully).

- name: Refuse the old `repos:` key (renamed to `git:`)
  ansible.builtin.assert:
    that: repos is not defined
    fail_msg: >-
      `repos:` was renamed to `git:`, and `build:`/`make_target:`/`commands:` were
      replaced by an ordered `install:` list. See docs/software.md (Migrating from repos).

- name: Skip git (none configured)
  ansible.builtin.debug:
    msg: "git is empty — nothing to clone."
  when: (git | default([])) | length == 0

- name: Clone + install git entries
  when: (git | default([])) | length > 0
  become: true
  become_user: "{{ device_user }}"
  vars:
    _home: "/home/{{ device_user }}"
    _state: "/home/{{ device_user }}/.local/state/cyberdeck/installed"
    _nl: "\n"   # a real newline, to join install commands into one script
  block:
    - name: Validate each entry (name + url; no old build keys)
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.url is defined
          - item.build is not defined
          - item.commands is not defined
        fail_msg: "git entries need `name` + `url`; `build`/`commands` are replaced by `install:` (a list of commands)."
      loop: "{{ git }}"
      loop_control:
        label: "{{ item.name | default(item.url) | default('?') }}"

    - name: Clone (or update) each repo
      ansible.builtin.git:
        repo: "{{ item.url }}"
        dest: "{{ (item.dest | default('~/src/' ~ item.name)) | regex_replace('^~', _home) }}"
        version: "{{ item.version | default('HEAD') }}"
        update: true
      loop: "{{ git }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Run install commands (in order, stop at first failure)
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ (item.dest | default('~/src/' ~ item.name)) | regex_replace('^~', _home) }}"
        cmd: |
          set -e
          key="$(git rev-parse HEAD) {{ item.install | to_json | hash('sha1') }}"
          marker="{{ _state }}/git-{{ item.name }}"
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$key" ]; then exit 0; fi
          bash -lc {{ (['set -ex'] + item.install) | join(_nl) | quote }}   # -x: a failure shows each command run, ending at the one that broke
          mkdir -p "{{ _state }}" && printf '%s' "$key" > "$marker"
          echo __CYBERDECK_INSTALLED__
      loop: "{{ git | selectattr('install', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: _git_install
      changed_when: "'__CYBERDECK_INSTALLED__' in _git_install.stdout"
