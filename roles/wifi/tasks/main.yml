---
# wifi — write prioritised NetworkManager WiFi profiles from the `wifi` list, so a
# freshly-flashed deck reconnects to your known networks unattended. Higher
# `priority` wins; each network is DHCP unless it has a `static` block. PSKs are
# secrets (no_log). Assumes NetworkManager (the default on Raspberry Pi OS
# bookworm/trixie, Lite included).

- name: Skip wifi (none configured)
  ansible.builtin.debug:
    msg: "wifi is empty — leaving the network config as-is."
  when: (wifi | default([])) | length == 0

- name: Configure WiFi
  when: (wifi | default([])) | length > 0
  block:
    - name: Write NetworkManager WiFi profiles
      ansible.builtin.template:
        src: wifi.nmconnection.j2
        dest: "/etc/NetworkManager/system-connections/cyberdeck-{{ item.ssid }}.nmconnection"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ wifi }}"
      loop_control:
        label: "{{ item.ssid }}"
      no_log: true
      notify: reload NetworkManager connections
