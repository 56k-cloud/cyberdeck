---
# downloads — fetch a pinned file (URL + sha256), then run the entry's `install`
# commands with $FILE set to the downloaded path. For prebuilt release binaries
# (a single static binary beats compiling on a 512 MB board). `install` runs in
# order, stopping at the first failure, in a bash LOGIN shell as the device user.
#
# Idempotent: the download is skipped when the file already matches its sha256;
# install re-runs only when the sha256 or the commands change.

- name: Skip downloads (none configured)
  ansible.builtin.debug:
    msg: "downloads is empty — nothing to fetch."
  when: (downloads | default([])) | length == 0

- name: Fetch + install downloads
  when: (downloads | default([])) | length > 0
  become: true
  become_user: "{{ device_user }}"
  vars:
    _home: "/home/{{ device_user }}"
    _cache: "/home/{{ device_user }}/.cache/cyberdeck/downloads"
    _state: "/home/{{ device_user }}/.local/state/cyberdeck/installed"
    _nl: "\n"   # a real newline, to join install commands into one script
  block:
    - name: Validate each entry (name + url + sha256 + install)
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.url is defined
          - item.sha256 is defined
          - item.sha256 is match('^[0-9a-fA-F]{64}$')
          - item.install is defined
        fail_msg: "downloads entries need `name`, `url`, a 64-hex `sha256`, and `install:` (a list of commands)."
      loop: "{{ downloads }}"
      loop_control:
        label: "{{ item.name | default(item.url) | default('?') }}"

    - name: Ensure the download cache and ~/.local/bin exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ _cache }}"
        - "{{ _home }}/.local/bin"

    - name: Download (verified against sha256)
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ _cache }}/{{ item.url | urlsplit('path') | basename }}"
        checksum: "sha256:{{ item.sha256 }}"
        mode: "0644"
      loop: "{{ downloads }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Run install commands (in order, stop at first failure)
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ _cache }}"
        cmd: |
          set -e
          key="{{ item.sha256 }} {{ item.install | to_json | hash('sha1') }}"
          marker="{{ _state }}/download-{{ item.name }}"
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$key" ]; then exit 0; fi
          bash -lc {{ (['set -e'] + item.install) | join(_nl) | quote }}
          mkdir -p "{{ _state }}" && printf '%s' "$key" > "$marker"
          echo __CYBERDECK_INSTALLED__
      environment:
        FILE: "{{ _cache }}/{{ item.url | urlsplit('path') | basename }}"
      loop: "{{ downloads }}"
      loop_control:
        label: "{{ item.name }}"
      register: _dl_install
      changed_when: "'__CYBERDECK_INSTALLED__' in _dl_install.stdout"
