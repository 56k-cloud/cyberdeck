---
# tooling — the terminal itself: zsh, tmux, git, stow, plus any opt-in extras.
# Kept light by constraint (SPEC §6: 512 MB shared with the framebuffer).

- name: Install the CLI tooling set
  ansible.builtin.apt:
    name: "{{ tooling_packages + tooling_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Make zsh the login shell for the device user
  ansible.builtin.user:
    name: "{{ device_user }}"
    shell: /usr/bin/zsh

# Debian's zsh does NOT read /etc/profile or /etc/profile.d, so every
# /etc/profile.d/*.sh a role drops (python PATH, creds env) would be silently
# skipped in the deck's login shell. Bridge it once here, in sh-emulation.
- name: Make zsh login shells read /etc/profile.d
  ansible.builtin.blockinfile:
    path: /etc/zsh/zprofile
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} cyberdeck: source /etc/profile.d"
    block: |
      emulate sh -c 'for f in /etc/profile.d/*.sh; do [ -r "$f" ] && . "$f"; done; unset f'
