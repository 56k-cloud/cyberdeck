---
# base — locale, timezone, a minimal package set, and SSH hardening. Fully
# profile-agnostic in behaviour; it reads the profile only to record what this
# device IS (see the marker file at the end), which is acceptance (e).

# Fail BEFORE we harden SSH if there is no key to log in with — disabling
# password auth without a working key is how you lock yourself out of a handheld.
# Fail BEFORE any SSH hardening if the keys are missing, still the placeholder,
# or malformed — hardening disables password auth, so a bad key = lockout.
# authorized_keys entries may be a public-key STRING or a PATH to a .pub file on
# the control machine. Resolve paths to their contents first, then validate — so
# the lockout guard checks the real key however it was supplied.
- name: Resolve login keys (public-key string or path to a .pub)
  ansible.builtin.set_fact:
    _auth_keys: "{{ _auth_keys | default([]) + [resolved] }}"
  vars:
    resolved: >-
      {{ item if item is match('^(ssh-|ecdsa-|sk-)')
         else lookup('file', item | regex_replace('^~', lookup('env', 'HOME'))) }}
  loop: "{{ device_authorized_keys }}"
  loop_control:
    label: "{{ item }}"

- name: Assert real SSH public key(s) resolved (not the placeholder)
  ansible.builtin.assert:
    that:
      - _auth_keys | default([]) | length > 0
      - "_auth_keys | default([]) | select('search', 'your-laptop-key') | list | length == 0"
      - "_auth_keys | default([]) | select('search', 'you@example') | list | length == 0"
      - "_auth_keys | default([]) | reject('match', '^(ssh-|ecdsa-|sk-ssh-)') | list | length == 0"
    fail_msg: >-
      ssh.authorized_keys must resolve to your REAL public key(s) — a key string,
      or a path to a .pub — not the example placeholder or empty. Base hardening
      disables SSH password auth, so an invalid key here locks you out.

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure the locale is generated
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

- name: Set the system default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: "LANG={{ locale }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install the minimal base package set
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# --- SSH hardening ------------------------------------------------------------
- name: Authorize the device user's login SSH keys
  ansible.posix.authorized_key:
    user: "{{ device_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ _auth_keys }}"

# A drop-in wins over the main sshd_config: Debian's Include line is near the top
# and sshd honours the first value it sees for each keyword.
- name: Harden SSH — key-only auth, no root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-cyberdeck-hardening.conf
    content: |
      # Managed by cyberdeck (base role). SSH is key-only.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
  notify: Restart SSH

- name: Validate the effective sshd config (fail before any restart if broken)
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

# --- Profile marker (acceptance e: a role reads the profile) ------------------
# Record what this device was provisioned as. Useful for operator debugging and
# read back by later increments that size themselves to the screen. This is a
# genuine consumption of profile data, not decoration.
- name: Ensure the cyberdeck state dir exists
  ansible.builtin.file:
    path: /etc/cyberdeck
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record the active profile on the device
  ansible.builtin.copy:
    dest: /etc/cyberdeck/profile.env
    content: |
      # Managed by cyberdeck (base role). The device's provisioned identity.
      CYBERDECK_PROFILE={{ cyberdeck_profile }}
      CYBERDECK_BOARD={{ profile.board }}
      CYBERDECK_SCREEN_WIDTH={{ profile.screen.width }}
      CYBERDECK_SCREEN_HEIGHT={{ profile.screen.height }}
      CYBERDECK_RAM_MB={{ profile.ram_mb }}
    owner: root
    group: root
    mode: "0644"
