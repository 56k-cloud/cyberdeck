---
# repos — clone the configured repos onto the deck and build each per its `build`
# type. Each entry needs `name` + `url`; the rest default (see config.example).
# Runs as the device user; uv comes from workstation, private clones use the keys
# from identity.

- name: Skip repos (none configured)
  ansible.builtin.debug:
    msg: "repos is empty — nothing to clone."
  when: (repos | default([])) | length == 0

- name: Clone + build repos
  when: (repos | default([])) | length > 0
  become: true
  become_user: "{{ device_user }}"
  vars:
    _home: "/home/{{ device_user }}"
    _uv: "/home/{{ device_user }}/.local/bin/uv"
  block:
    - name: Validate each repo has name + url
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.url is defined
        fail_msg: "every repos entry needs at least `name` and `url`."
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.name | default(item.url) | default('?') }}"

    - name: Clone (or update) each repo
      ansible.builtin.git:
        repo: "{{ item.url }}"
        dest: "{{ (item.dest | default('~/src/' ~ item.name)) | regex_replace('^~', _home) }}"
        version: "{{ item.version | default('HEAD') }}"
        update: true
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.name }}"

    # build: pip -> a venv + requirements.txt (uv does both, fast)
    - name: "Build (pip): venv + requirements.txt"
      ansible.builtin.shell:
        cmd: |
          set -e
          cd "{{ (item.dest | default('~/src/' ~ item.name)) | regex_replace('^~', _home) }}"
          [ -d .venv ] || {{ _uv }} venv .venv
          {{ _uv }} pip install --python .venv/bin/python -r requirements.txt
      loop: "{{ repos | selectattr('build', 'defined') | selectattr('build', 'equalto', 'pip') | list }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    # build: uv -> uv sync (uv project with pyproject/uv.lock)
    - name: "Build (uv): uv sync"
      ansible.builtin.command:
        cmd: "{{ _uv }} sync"
        chdir: "{{ (item.dest | default('~/src/' ~ item.name)) | regex_replace('^~', _home) }}"
      loop: "{{ repos | selectattr('build', 'defined') | selectattr('build', 'equalto', 'uv') | list }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    # build: make -> make [target]
    - name: "Build (make): make <target>"
      ansible.builtin.command:
        cmd: "make {{ item.make_target | default('') }}"
        chdir: "{{ (item.dest | default('~/src/' ~ item.name)) | regex_replace('^~', _home) }}"
      loop: "{{ repos | selectattr('build', 'defined') | selectattr('build', 'equalto', 'make') | list }}"
      loop_control:
        label: "{{ item.name }} (make {{ item.make_target | default('') }})"
      changed_when: true

    # build: custom -> run each command in the repo
    - name: "Build (custom): run commands"
      ansible.builtin.shell:
        cmd: "{{ item.1 }}"
        chdir: "{{ (item.0.dest | default('~/src/' ~ item.0.name)) | regex_replace('^~', _home) }}"
      loop: "{{ repos | selectattr('build', 'defined') | selectattr('build', 'equalto', 'custom') | subelements('commands', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1 }}"
      changed_when: true

    # `entrypoint` is recorded but not wired yet — flag it rather than ignore it.
    - name: Note repos with an entrypoint (not wired yet)
      ansible.builtin.debug:
        msg: "repo {{ item.name }} sets `entrypoint` ({{ item.entrypoint }}) — not auto-run yet (planned: a systemd --user unit)."
      loop: "{{ repos | selectattr('entrypoint', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
