---
device_user: deck

# Your lists (workstation_python / workstation_apt / workstation_pip) come from
# config.yml's `workstation:` block via site.yml — not defaulted here.

# System packages the role always ensures: python3 + the classic-venv/pip bits,
# and pipx (our doctrine-friendly way to install uv — no piped install script).
workstation_base_apt:
  - python3
  - python3-venv
  - python3-pip
  - pipx
  - direnv          # auto per-directory env activation (see docs/pyenv.md)

# The DEFAULT Python env: a uv-managed venv (relative to the device user's home)
# that's always created and put on PATH, so `python` has these libs available
# without activating a project venv. Holds workstation_default_pip + workstation.pip.
# Never system pip.
workstation_pip_venv: ".venvs/base"

# Base libraries shipped in the default env: rich (pretty terminal output) +
# textual (build TUIs; same author as rich). `curses` needs no install — it's
# Python stdlib. The user's workstation.pip is added on top.
workstation_default_pip:
  - rich
  - textual
