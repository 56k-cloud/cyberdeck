---
# workstation — the Python dev toolchain. Installs uv + the requested Python
# versions (managed by uv, installed once), the system venv/pip bits for the
# classic `python3 -m venv` + activate workflow, your apt apps, and your baseline
# pip packages into a uv-managed venv (never system pip). Skips when python.enable
# is false.
#
# Both workflows work afterwards:
#   uv-managed:  uv venv --python 3.10 .venv && source .venv/bin/activate   (or uv run)
#   classic:     python3 -m venv .venv && source .venv/bin/activate

- name: Skip workstation (python.enable is false)
  ansible.builtin.debug:
    msg: "python.enable is false — skipping the Python toolchain."
  when: not (python.enable | default(true))

- name: Python workstation
  when: python.enable | default(true)
  vars:
    _home: "/home/{{ device_user }}"
    _uv: "/home/{{ device_user }}/.local/bin/uv"
  block:
    - name: Install apt packages (toolchain base + your list)
      ansible.builtin.apt:
        name: "{{ workstation_base_apt + (packages.apt | default([])) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # uv + the Python versions live in the device user's home (~/.local).
    - name: Check whether uv is installed
      ansible.builtin.stat:
        path: "{{ _uv }}"
      register: _uv_bin

    - name: Install uv via pipx
      become: true
      become_user: "{{ device_user }}"
      ansible.builtin.command: pipx install uv
      when: not _uv_bin.stat.exists
      changed_when: true

    - name: Ensure ~/.local/bin is on PATH (pipx ensurepath)
      become: true
      become_user: "{{ device_user }}"
      ansible.builtin.command: pipx ensurepath
      register: _ensurepath
      changed_when: "'added' in (_ensurepath.stdout | lower)"

    - name: Install the requested Python versions (uv — the last is the default)
      become: true
      become_user: "{{ device_user }}"
      ansible.builtin.command: "{{ _uv }} python install {{ python.versions | join(' ') }}"
      register: _uv_py
      changed_when: "'Installed' in (_uv_py.stdout + _uv_py.stderr)"

    # Baseline pip packages -> a uv-managed venv (never system pip).
    # The default env: always created (so `python` has the base libs), newest
    # interpreter, holds the default libs + the user's packages.pip.
    - name: Create the default Python env
      become: true
      become_user: "{{ device_user }}"
      ansible.builtin.command:
        cmd: "{{ _uv }} venv --python {{ python.versions[-1] }} {{ _home }}/{{ workstation_pip_venv }}"
        creates: "{{ _home }}/{{ workstation_pip_venv }}"

    - name: Install the base libraries into the default env
      become: true
      become_user: "{{ device_user }}"
      ansible.builtin.command:
        cmd: >-
          {{ _uv }} pip install --python {{ _home }}/{{ workstation_pip_venv }}/bin/python
          {{ (workstation_default_pip + (packages.pip | default([]))) | join(' ') }}
      register: _uv_pip
      changed_when: "'Installed' in (_uv_pip.stdout + _uv_pip.stderr)"
      when: (workstation_default_pip + (packages.pip | default([]))) | length > 0

    # Make the default env the one you get in a login shell (bash + zsh) without
    # activating anything — project venvs still override when activated.
    - name: Put the default Python env on PATH for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/20-cyberdeck-python.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by cyberdeck (workstation). Default Python env on PATH.
          if [ -d "$HOME/{{ workstation_pip_venv }}/bin" ]; then
            case ":$PATH:" in
              *":$HOME/{{ workstation_pip_venv }}/bin:"*) ;;
              *) PATH="$HOME/{{ workstation_pip_venv }}/bin:$PATH" ;;
            esac
          fi
