---
device_user: deck

# HTTPS URL of the PUBLIC dotfiles repo. Empty => this role no-ops (the device
# still has a working shell from the tooling role).
dotfiles_public_repo: ""

# Where the repo is cloned (internal). The stow PACKAGES are not defaulted here —
# they come from config.yml (dotfiles.stow), the one place you tune them.
dotfiles_clone_dir: "dotfiles-public"   # relative to the device user's home
