---
# init — PicoCalc hardware enablement. Guarded on the profile's `hardware`
# selector, so generic boards skip it. Values are inline in the tasks (this is a
# faithful, device-specific translation of the upstream guide), not parameterised
# into the profile — a different panel is a different init flow.

init_boot_dir: /boot/firmware          # Raspberry Pi OS (bookworm/trixie) boot partition
init_src_dir: /usr/src/picocalc_kbd

# Kernel headers to build the out-of-tree keyboard module. Current Raspberry Pi OS
# ships these as `linux-headers-rpi-v8` (Pi Zero 2 W runs the v8 kernel); the old
# `raspberrypi-kernel-headers` name is gone on Trixie. If apt can't find this,
# run `uname -r; apt-cache search '^linux-headers'` on the deck and set it to match.
init_kernel_headers_pkg: linux-headers-rpi-v8
