---
# init — bring the PicoCalc hardware up, one step at a time, mirroring the upstream
# guide (pinned in upstream-refs.yml; source vendored under files/picocalc/). The
# step names follow the upstream's: install display driver → install keyboard
# driver → configure audio → poweroff. It runs FIRST, then reboots so the overlays
# load; the system stages (base, tooling, …) run after on a working deck.
#
# We translate the steps into idempotent tasks — we never run the upstream script.
# This flow is PicoCalc-specific by design, guarded on the profile's `hardware`.

- name: Skip hardware init (profile is not a PicoCalc)
  ansible.builtin.debug:
    msg: "profile.hardware != picocalc for {{ cyberdeck_profile }} — skipping hardware init."
  when: (profile.hardware | default('')) != 'picocalc'

- name: PicoCalc hardware init
  when: (profile.hardware | default('')) == 'picocalc'
  vars:
    boot_dir: "{{ init_boot_dir }}"
  block:

    # === Step 4: install display driver (panel_mipi_dbi) =====================
    - name: "Step 4.1 — display: copy the panel firmware"
      ansible.builtin.copy:
        src: picocalc/display/picomipi.bin
        dest: /lib/firmware/picomipi.bin
        owner: root
        group: root
        mode: "0644"
      register: _display_fw

    - name: "Step 4.2 — display: SPI panel overlay in config.txt"
      ansible.builtin.blockinfile:
        path: "{{ boot_dir }}/config.txt"
        marker: "# {mark} cyberdeck display"
        create: false
        block: |
          dtparam=spi=on
          dtoverlay=mipi-dbi-spi,spi0-0,speed=70000000
          dtparam=compatible=picomipi\0panel-mipi-dbi-spi
          dtparam=width=320,height=320,width-mm=43,height-mm=43
          dtparam=reset-gpio=25,dc-gpio=24
          dtparam=backlight-gpio=18
          dtparam=clock-frequency=50
      register: _display_cfg

    - name: "Step 4.3 — display: framebuffer console in cmdline.txt"
      ansible.builtin.shell:
        cmd: |
          set -e
          if ! grep -q 'fbcon=map:1' {{ boot_dir }}/cmdline.txt; then
            sed -i 's/[[:space:]]*$/ fbcon=map:1 fbcon=font:MINI4x6/' {{ boot_dir }}/cmdline.txt
            echo CHANGED
          fi
      register: _display_cmdline
      changed_when: "'CHANGED' in _display_cmdline.stdout"

    # === Step 5: install keyboard driver (picocalc_kbd) ======================
    - name: "Step 5.1 — keyboard: install build deps + i2c tools"
      ansible.builtin.apt:
        name:
          - build-essential
          - device-tree-compiler
          - i2c-tools
          - "{{ init_kernel_headers_pkg }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: "Step 5.2 — keyboard: stage the driver source"
      ansible.builtin.copy:
        src: picocalc/keyboard/
        dest: "{{ init_src_dir }}/"
        owner: root
        group: root
        mode: preserve
      register: _kbd_src

    - name: "Step 5.3 — keyboard: is the module already built?"
      ansible.builtin.stat:
        path: "/lib/modules/{{ ansible_kernel }}/extra/picocalc_kbd.ko"
      register: _kbd_ko

    - name: "Step 5.4 — keyboard: build the module against the running kernel"
      ansible.builtin.command:
        cmd: "make -C /lib/modules/{{ ansible_kernel }}/build M={{ init_src_dir }} modules"
      register: _kbd_build
      changed_when: _kbd_build.rc == 0
      when: _kbd_src is changed or not _kbd_ko.stat.exists

    - name: "Step 5.5 — keyboard: install the module + depmod"
      ansible.builtin.shell:
        cmd: |
          set -e
          install -D -m 0644 {{ init_src_dir }}/picocalc_kbd.ko \
            /lib/modules/{{ ansible_kernel }}/extra/picocalc_kbd.ko
          depmod {{ ansible_kernel }}
      register: _kbd_install
      changed_when: _kbd_install.rc == 0
      when: _kbd_build is changed

    - name: "Step 5.6 — keyboard: compile + install the DT overlay"
      ansible.builtin.command:
        cmd: >-
          dtc -@ -I dts -O dtb -o {{ boot_dir }}/overlays/picocalc_kbd.dtbo
          {{ init_src_dir }}/dts/picocalc_kbd-overlay.dts
        creates: "{{ boot_dir }}/overlays/picocalc_kbd.dtbo"
      register: _kbd_dtbo

    - name: "Step 5.7 — keyboard: enable i2c + overlay in config.txt"
      ansible.builtin.blockinfile:
        path: "{{ boot_dir }}/config.txt"
        marker: "# {mark} cyberdeck keyboard"
        create: false
        block: |
          dtparam=i2c_arm=on
          dtoverlay=picocalc_kbd
      register: _kbd_cfg

    # === Step 6: configure audio (takes effect on the same reboot) ===========
    - name: "Step 6 — audio: enable in config.txt"
      ansible.builtin.blockinfile:
        path: "{{ boot_dir }}/config.txt"
        marker: "# {mark} cyberdeck audio"
        create: false
        block: |
          dtparam=audio=on
          dtoverlay=audremap,pins_12_13
      register: _audio_cfg

    # === Step 7: power the mainboard off on shutdown =========================
    - name: "Step 7.1 — poweroff: install the helper"
      ansible.builtin.copy:
        dest: /usr/local/bin/picopoweroff
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Cut power to the PicoCalc mainboard on shutdown (i2c).
          i2cset -yf 1 0x1f 0x8e 0x00

    - name: "Step 7.2 — poweroff: systemd service"
      ansible.builtin.copy:
        dest: /etc/systemd/system/picopoweroff.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Shutdown PicoCalc mainboard
          Conflicts=reboot.target
          DefaultDependencies=no
          After=shutdown.target
          Requires=shutdown.target

          [Service]
          Type=oneshot
          RemainAfterExit=true
          ExecStart=/usr/local/bin/picopoweroff

          [Install]
          WantedBy=shutdown.target

    - name: "Step 7.3 — poweroff: enable the service"
      ansible.builtin.systemd:
        name: picopoweroff.service
        enabled: true
        daemon_reload: true

    # === Verify the drivers are in place, then mark the stage complete =======
    - name: "Verify: driver artifacts exist"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/lib/modules/{{ ansible_kernel }}/extra/picocalc_kbd.ko"
        - /lib/firmware/picomipi.bin
        - "{{ boot_dir }}/overlays/picocalc_kbd.dtbo"
      register: _verify

    - name: "Verify: fail the init stage if any artifact is missing"
      ansible.builtin.assert:
        that:
          - _verify.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: "PicoCalc init incomplete — a driver artifact is missing; not marking complete."

    - name: "Ensure the cyberdeck state dir exists"
      ansible.builtin.file:
        path: /etc/cyberdeck
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Mark the init stage complete on the device"
      ansible.builtin.copy:
        dest: /etc/cyberdeck/init-complete
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by cyberdeck init. Hardware init applied (active after reboot).
          profile={{ cyberdeck_profile }}
          kernel={{ ansible_kernel }}
          display=panel-mipi-dbi
          keyboard=picocalc_kbd
          audio=audremap
          poweroff=picopoweroff

    # === Reboot so the overlays load (only when something changed) ===========
    - name: "Reboot to load the display / keyboard / audio overlays"
      ansible.builtin.reboot:
        reboot_timeout: 300
        msg: "cyberdeck init: rebooting to load overlays"
      when: >-
        _display_fw is changed or _display_cfg is changed or _display_cmdline is changed
        or _kbd_install is changed or _kbd_dtbo is changed or _kbd_cfg is changed
        or _audio_cfg is changed
